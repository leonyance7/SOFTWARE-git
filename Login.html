<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - Hotel System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* Fondo claro */
        }
        .image-background {
            background-image: url('https://www.erco.com/images/situations-in-the-hotel-lobby-7625/eur-erco-situations-in-the-hotel-lobby-intro-3-31.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="h-screen flex">
    
    <div class="hidden lg:flex w-1/2 image-background items-center justify-center">
        <div class="p-8 bg-black/60 backdrop-blur-sm rounded-xl text-white text-center">
            <h1 class="text-4xl font-bold mb-2">Bienvenido a NAVILL Soft</h1>
            <p class="text-lg font-light">Gestión ágil para su Hotel.</p>
        </div>
    </div>

    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 md:p-16">
        <div class="max-w-md w-full">
            
            <div class="text-center mb-10">
                <img src="logo.png" alt="Hotel Logo" class="mx-auto h-24 mb-4">
                <h2 class="text-3xl font-extrabold text-gray-900">
                    Inisio de Sesión
                </h2>
                <p class="mt-2 text-sm text-gray-600">
                    Ingrese su usuario y contraseña.
                </p>
            </div>
            
            <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                <strong class="font-bold">Error:</strong>
                <span id="error-text" class="block sm:inline"></span>
            </div>

            <form id="loginForm" class="space-y-6">
                
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                        Usuario
                    </label>
                    <div class="mt-1 relative">
                        <i class="ph ph-user absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input id="username" name="username" type="text" autocomplete="username" required
                            class="appearance-none block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-black focus:border-black sm:text-sm"
                            placeholder="Ej: recepcion01">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        Contraseña
                    </label>
                    <div class="mt-1 relative">
                        <i class="ph ph-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                            class="appearance-none block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-black focus:border-black sm:text-sm"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex flex-col gap-3">
                    <button type="submit" id="loginButton"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-black hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black transition ease-in-out duration-150">
                        <i class="ph ph-sign-in mr-2 text-lg"></i>
                        Iniciar Sesión
                    </button>

                    <button type="button" onclick="openCreateUserModal()"
                        class="w-full flex justify-center py-2.5 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-300 transition ease-in-out duration-150">
                        <i class="ph ph-user-plus mr-2 text-lg"></i>
                        Crear Usuario
                    </button>
                </div>
            </form>
            
            <p class="mt-6 text-center text-sm text-gray-500">
                ¿Olvidó su contraseña? 
                <a href="#" class="font-medium text-black hover:text-gray-700">
                    Restablecer
                </a>
            </p>

        </div>
    </div>

    <div id="createUserModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onclick="closeCreateUserModal()"></div>
        
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-white shadow-2xl rounded-lg overflow-hidden">
            
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-xl font-bold text-black flex items-center gap-2"><i class="ph ph-user-plus"></i> Registrar Nuevo Empleado</h3>
                <button onclick="closeCreateUserModal()" class="text-gray-400 hover:text-black transition"><i class="ph ph-x text-xl"></i></button>
            </div>

            <form id="createUserForm" class="p-8">
                
                <div class="space-y-4">
                    <div>
                        <label for="newUsername" class="block text-sm font-medium text-gray-700 mb-1">Nombre de Usuario</label>
                        <input type="text" id="newUsername" required
                            class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-black focus:border-black" placeholder="Ej: maria_adm">
                    </div>
                    
                    <div>
                        <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                        <input type="password" id="newPassword" required
                            class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-black focus:border-black" placeholder="Contraseña segura">
                    </div>

                    <div>
                        <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Rol / Puesto</label>
                        <select id="role" required
                            class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-black focus:border-black bg-white">
                            <option value="" disabled selected>Seleccione el rol</option>
                            <option value="admin">Administrador</option>
                            <option value="recepcion">Recepción</option>
                            <option value="mantenimiento">Mantenimiento</option>
                        </select>
                    </div>
                </div>

                <div class="mt-8 flex justify-end gap-3 pt-6 border-t border-gray-100">
                    <button type="button" onclick="closeCreateUserModal()" class="px-5 py-2 border border-gray-300 text-gray-600 rounded hover:bg-gray-100 transition text-sm font-medium">Cancelar</button>
                    <button type="submit" id="createUserButton" class="px-5 py-2 bg-black text-white rounded hover:bg-gray-800 transition text-sm font-medium shadow-lg shadow-gray-400/20">
                        <i class="ph ph-user-check mr-2"></i> Confirmar Creación
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        const loginForm = document.getElementById('loginForm');
        const createUserForm = document.getElementById('createUserForm');
        const createUserModal = document.getElementById('createUserModal');
        const errorMessageDiv = document.getElementById('error-message');
        const errorTextSpan = document.getElementById('error-text');
        const loginButton = document.getElementById('loginButton');
        const createUserButton = document.getElementById('createUserButton');

        function showLoading(button, isLoading, initialText, loadingText) {
            button.disabled = isLoading;
            button.innerHTML = isLoading 
                ? `<i class="ph ph-spinner-gap animate-spin mr-2 text-lg"></i> ${loadingText}`
                : initialText;
        }

        function displayError(message) {
            errorTextSpan.textContent = message;
            errorMessageDiv.classList.remove('hidden');
        }

        function hideError() {
            errorMessageDiv.classList.add('hidden');
        }

        // --- Lógica de Login (Existente) ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            showLoading(loginButton, true, '<i class="ph ph-sign-in mr-2 text-lg"></i> Iniciar Sesión', 'Verificando...');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                showLoading(loginButton, false, '<i class="ph ph-sign-in mr-2 text-lg"></i> Iniciar Sesión', 'Verificando...');

                if (response.ok) {
                    const data = await response.json();
                    alert(`¡Acceso exitoso! Bienvenido ${username}. Rol: ${data.role}`);
                    
                    // Redirigir según el rol
                    if (data.role === 'admin') {
                        window.location.href = 'Administracion.html';
                    } else if (data.role === 'recepcion') {
                        window.location.href = 'Recepcion.html';
                    } else {
                        window.location.href = 'Inicio.html';
                    }

                } else {
                    const errorData = await response.json();
                    displayError(errorData.message || 'Credenciales inválidas o error de servidor.');
                }
            } catch (error) {
                showLoading(loginButton, false, '<i class="ph ph-sign-in mr-2 text-lg"></i> Iniciar Sesión', 'Verificando...');
                console.error('Error de conexión:', error);
                displayError('No se pudo conectar al servidor de autenticación.');
            }
        });

        // --- Lógica del Modal ---
        function openCreateUserModal() {
            createUserModal.classList.remove('hidden');
            createUserModal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Evita el scroll del fondo
            hideError(); // Limpia errores del login si los había
        }

        function closeCreateUserModal() {
            createUserModal.classList.add('hidden');
            createUserModal.classList.remove('flex');
            document.body.style.overflow = 'auto';
            createUserForm.reset();
        }

        // --- Lógica de Creación de Usuario (Nuevo) ---
        createUserForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            showLoading(createUserButton, true, '<i class="ph ph-user-check mr-2"></i> Confirmar Creación', 'Creando...');

            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newPassword').value;
            const role = document.getElementById('role').value;

            try {
                // Endpoint POST /api/users (Debe ser creado en server.js)
                const response = await fetch(`${API_BASE_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                showLoading(createUserButton, false, '<i class="ph ph-user-check mr-2"></i> Confirmar Creación', 'Creando...');

                if (response.ok) {
                    alert(`¡Usuario ${username} creado exitosamente con el rol ${role}!`);
                    closeCreateUserModal();
                } else {
                    const errorData = await response.json();
                    alert(`Error al crear usuario: ${errorData.message || 'Error desconocido'}`);
                }

            } catch (error) {
                showLoading(createUserButton, false, '<i class="ph ph-user-check mr-2"></i> Confirmar Creación', 'Creando...');
                console.error('Error de conexión al crear usuario:', error);
                alert('Error de conexión con el servidor. No se pudo crear el usuario.');
            }
        });

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Administración - Hotel System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #1a1a1a;
        }
        .btn-primary {
            background-color: #000000;
            color: #ffffff;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #333333;
        }
        .admin-table th {
            background-color: #f4f4f4;
            color: #333333;
            border-bottom: 2px solid #e0e0e0;
        }
        .admin-table td {
            border-bottom: 1px solid #eeeeee;
        }
        .admin-table tr:hover {
            background-color: #fafafa;
        }
        /* Estilo para el modal */
        .modal {
            transition: opacity 0.2s, visibility 0.2s;
        }
        .modal.hidden {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <aside class="w-64 bg-black text-white flex flex-col shadow-xl z-20">
        <div class="logo-container p-6">
            <img src="logo2.png" alt="Logo Hotel Soft" class="w-32 mx-auto">
        </div>

        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1">
                <li><a href="Inicio.html" class="flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors"><i class="ph ph-house text-xl"></i><span>Inicio</span></a></li>
                <li><a href="Recepcion.HTML" class="flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors"><i class="ph ph-bell-concierge text-xl"></i><span>Recepción</span></a></li>
                <li>
                    <a href="Administracion.html" class="flex items-center gap-3 px-6 py-3 bg-white text-black font-medium border-l-4 border-gray-400">
                        <i class="ph ph-users text-xl"></i>
                        <span>Administración</span>
                    </a>
                    <ul class="ml-4 mt-1 space-y-1 text-sm">
                        <li><a onclick="switchTab('usuarios')" class="block px-6 py-2 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors cursor-pointer">Usuarios</a></li>
                        <li><a onclick="switchTab('habitaciones')" class="block px-6 py-2 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors cursor-pointer">Habitaciones</a></li>
                        <li><a onclick="switchTab('configuracion')" class="block px-6 py-2 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors cursor-pointer">Configuración</a></li>
                        <li><a onclick="switchTab('log')" class="block px-6 py-2 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors cursor-pointer">Log de Acceso</a></li>
                    </ul>
                </li>
                <li><a href="Mantenimiento.html" class="flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors"><i class="ph ph-wrench text-xl"></i><span>Mantenimiento</span></a></li>
                <li><a href="GestionReservas.html" class="flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors"><i class="ph ph-calendar-check text-xl"></i><span>Gestión de Reservas</span></a></li>
                <li><a href="Ventas.html" class="flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors"><i class="ph ph-currency-dollar text-xl"></i><span>Ventas</span></a></li>
            </ul>
        </nav>

        <div class="p-4 border-t border-gray-800">
            <button onclick="logout()" class="w-full btn-primary bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded shadow-md text-sm font-medium">
                <i class="ph ph-sign-out mr-2"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-gray-50 relative">
        
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm">
            <h1 class="text-xl font-semibold text-gray-800">Panel Administrativo</h1>
            <div class="flex items-center gap-4">
                <span id="currentDate" class="text-sm text-gray-500 font-medium border-r border-gray-300 pr-4"></span>
                <button class="p-2 text-gray-600 hover:bg-gray-100 rounded-full relative"><i class="ph ph-bell text-xl"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-8">
            
            <div class="border-b border-gray-300 mb-6 bg-white rounded-t-lg shadow-sm">
                <nav class="flex space-x-4 px-6 pt-4">
                    <button id="tab-usuarios" onclick="switchTab('usuarios')" class="tab-button pb-3 text-sm font-medium text-black border-b-2 border-black"><i class="ph ph-users mr-2"></i> Gestión de Usuarios</button>
                    <button id="tab-habitaciones" onclick="switchTab('habitaciones')" class="tab-button pb-3 text-sm font-medium text-gray-500 hover:text-black border-b-2 border-transparent hover:border-gray-500"><i class="ph ph-bed mr-2"></i> Gestión de Habitaciones</button>
                    <button id="tab-configuracion" onclick="switchTab('configuracion')" class="tab-button pb-3 text-sm font-medium text-gray-500 hover:text-black border-b-2 border-transparent hover:border-gray-500"><i class="ph ph-gear-six mr-2"></i> Configuración Global</button>
                    <button id="tab-log" onclick="switchTab('log')" class="tab-button pb-3 text-sm font-medium text-gray-500 hover:text-black border-b-2 border-transparent hover:border-gray-500"><i class="ph ph-list-numbers mr-2"></i> Log de Acceso</button>
                </nav>
            </div>

            <div id="tab-content" class="bg-white p-6 rounded-lg shadow-lg min-h-[500px]">
                <div id="loading-spinner" class="text-center p-20 text-gray-500">
                    <i class="ph ph-spinner-gap animate-spin text-4xl mb-2"></i>
                    <p>Cargando datos...</p>
                </div>
            </div>
        </div>
    </main>
    
    <div id="userModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-md m-4">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-800">Crear Nuevo Usuario</h3>
                <button onclick="closeUserModal()" class="text-gray-400 hover:text-black"><i class="ph ph-x text-xl"></i></button>
            </div>
            
            <form id="userForm" class="p-6 space-y-4">
                <input type="hidden" id="userId" name="id">
                
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Nombre Completo</label>
                    <input type="text" id="name" name="name" required class="w-full border border-gray-300 p-2 rounded-md focus:ring-black focus:border-black">
                </div>
                
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Nombre de Usuario (Login)</label>
                    <input type="text" id="username" name="username" required class="w-full border border-gray-300 p-2 rounded-md focus:ring-black focus:border-black">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Contraseña (Mín. 6 chars)</label>
                    <input type="password" id="password" name="password" required class="w-full border border-gray-300 p-2 rounded-md focus:ring-black focus:border-black">
                    <p id="passwordHint" class="text-xs text-red-500 mt-1 hidden">La contraseña es obligatoria en la creación.</p>
                </div>
                
                <div>
                    <label for="role" class="block text-sm font-medium text-gray-700">Rol</label>
                    <select id="role" name="role" required class="w-full border border-gray-300 p-2 rounded-md focus:ring-black focus:border-black bg-white">
                        <option value="recepcion">Recepción</option>
                        <option value="admin">Administrador</option>
                        <option value="mantenimiento">Mantenimiento</option>
                        <option value="contador">Contador</option>
                    </select>
                </div>
                
                <div class="pt-4 flex justify-end">
                    <button type="submit" id="submitUserButton" class="btn-primary px-6 py-2 rounded text-sm font-medium shadow-md">
                        <i class="ph ph-floppy-disk mr-2"></i> Guardar Usuario
                    </button>
                </div>
                <div id="userModalError" class="text-red-500 text-sm mt-3 hidden"></div>
            </form>
        </div>
    </div>


    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        const tabContentDiv = document.getElementById('tab-content');
        const userModal = document.getElementById('userModal');
        const userForm = document.getElementById('userForm');
        const modalTitle = document.getElementById('modalTitle');
        const submitUserButton = document.getElementById('submitUserButton');
        const passwordHint = document.getElementById('passwordHint');
        const userModalError = document.getElementById('userModalError');
        let currentEditingUserId = null;


        // --- UTILS ---
        function showLoading(show = true) {
            const spinner = document.getElementById('loading-spinner');
            if (spinner) {
                spinner.classList.toggle('hidden', !show);
            }
            tabContentDiv.classList.toggle('min-h-[500px]', show);
        }

        function formatDate(date) {
            return new Date(date).toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // --- MANEJO DE PESTAÑAS (TABS) ---
        function switchTab(tabId) {
            const tabButtons = document.querySelectorAll('.tab-button');
            
            // 1. Resetear estilos de botones
            tabButtons.forEach(button => {
                button.classList.remove('border-black', 'text-black', 'border-b-2');
                button.classList.add('border-transparent', 'text-gray-500', 'hover:border-gray-500');
            });

            // 2. Activar el botón seleccionado
            const activeButton = document.getElementById(`tab-${tabId}`);
            if (activeButton) {
                activeButton.classList.add('border-black', 'text-black', 'border-b-2');
                activeButton.classList.remove('border-transparent', 'text-gray-500', 'hover:border-gray-500');
            }

            // 3. Cargar el contenido dinámico
            tabContentDiv.innerHTML = '<div id="loading-spinner" class="text-center p-20 text-gray-500"><i class="ph ph-spinner-gap animate-spin text-4xl mb-2"></i><p>Cargando datos...</p></div>';
            showLoading(true);

            // Cargar datos según la pestaña
            if (tabId === 'usuarios') {
                loadUserManagementTab();
            } else if (tabId === 'habitaciones') {
                loadRoomManagementTab();
            } else {
                // Para las pestañas estáticas o con datos simulados
                loadStaticTab(tabId);
            }
        }

        // --- TABS DINÁMICAS (AJAX) ---

        // Pestaña: Gestión de Usuarios
        async function loadUserManagementTab() {
            try {
                const response = await fetch(`${API_BASE_URL}/admin/users`);
                const users = await response.json();
                
                const tableRows = users.map(user => `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-black">${user.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.role}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.username}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDate(user.created_at)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="openEditUserModal(${user.id})" class="text-gray-600 hover:text-black transition p-1 rounded-full">
                                <i class="ph ph-pencil-simple text-lg"></i>
                            </button>
                            <button onclick="deleteUser(${user.id}, '${user.username}')" class="text-red-500 hover:text-red-700 transition p-1 rounded-full ml-2">
                                <i class="ph ph-trash text-lg"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                tabContentDiv.innerHTML = `
                    <h3 class="text-xl font-semibold mb-4">Gestión de Usuarios de Empleados</h3>
                    <div class="flex justify-between items-center mb-4">
                        <input type="text" placeholder="Buscar usuario por nombre o rol..." class="w-64 border border-gray-300 rounded px-3 py-2 text-black focus:outline-none focus:border-black">
                        <button onclick="openCreateUserModal()" class="btn-primary px-4 py-2 rounded text-sm font-medium shadow-md">
                            <i class="ph ph-user-plus mr-2"></i> Nuevo Usuario
                        </button>
                    </div>
                    <div class="overflow-x-auto rounded-lg border border-gray-200">
                        <table class="min-w-full divide-y divide-gray-200 admin-table">
                            <thead>
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Nombre</th>
                                    <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Rol</th>
                                    <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Usuario</th>
                                    <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Creado</th>
                                    <th class="px-6 py-3 text-right text-xs font-bold uppercase tracking-wider">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                tabContentDiv.innerHTML = `<p class="text-red-500">Error al cargar usuarios: ${error.message}. Verifique el servidor.</p>`;
                console.error('Error fetching users:', error);
            } finally {
                showLoading(false);
            }
        }

        // Pestaña: Gestión de Habitaciones
        async function loadRoomManagementTab() {
            try {
                const response = await fetch(`${API_BASE_URL}/habitaciones`);
                const rooms = await response.json();
                
                const tableRows = rooms.map(room => `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-black">${room.id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${room.tipo}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">$${room.precio_noche}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                                ${room.estado === 'libre' ? 'bg-green-100 text-green-800' : 
                                room.estado === 'ocupada' ? 'bg-red-100 text-red-800' : 
                                room.estado === 'limpieza' ? 'bg-yellow-100 text-yellow-800' : 
                                'bg-gray-100 text-gray-800'}">
                                ${room.estado.toUpperCase()}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="alert('Editar Habitación ${room.id}')" class="text-gray-600 hover:text-black transition p-1 rounded-full">
                                <i class="ph ph-pencil-simple text-lg"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                tabContentDiv.innerHTML = `
                    <h3 class="text-xl font-semibold mb-4">Gestión de Tipos y Precios de Habitaciones</h3>
                    <div class="flex justify-between items-center mb-4">
                        <input type="text" placeholder="Buscar habitación por ID o tipo..." class="w-64 border border-gray-300 rounded px-3 py-2 text-black focus:outline-none focus:border-black">
                        <button onclick="alert('Abrir Modal Nueva Habitación')" class="btn-primary px-4 py-2 rounded text-sm font-medium shadow-md">
                            <i class="ph ph-plus-circle mr-2"></i> Nueva Habitación
                        </button>
                    </div>
                    <div class="overflow-x-auto rounded-lg border border-gray-200">
                        <table class="min-w-full divide-y divide-gray-200 admin-table">
                            <thead>
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Tipo</th>
                                    <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Precio Noche</th>
                                    <th class="px-6 py-3 text-left text-xs font-bold uppercase tracking-wider">Estado Actual</th>
                                    <th class="px-6 py-3 text-right text-xs font-bold uppercase tracking-wider">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                tabContentDiv.innerHTML = `<p class="text-red-500">Error al cargar habitaciones: ${error.message}. Verifique el servidor.</p>`;
                console.error('Error fetching rooms:', error);
            } finally {
                showLoading(false);
            }
        }

        // Pestañas Estáticas
        function loadStaticTab(tabId) {
            // Mapeo de contenido para las pestañas estáticas o con datos simulados
            const staticContentMap = {
                'configuracion': `
                    <h3 class="text-xl font-semibold mb-4">Configuración del Sistema</h3>
                    <form class="space-y-6 max-w-lg">
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">Tasa de Impuestos (%)</label>
                            <input type="number" value="19" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-black">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">Moneda por Defecto</label>
                            <select class="w-full border border-gray-300 rounded px-3 py-2 bg-white focus:outline-none focus:border-black">
                                <option>COP - Peso Colombiano</option>
                                <option>USD - Dólar Estadounidense</option>
                            </select>
                        </div>
                        <div class="flex items-center space-x-3 pt-2">
                            <input id="anon-reservas" type="checkbox" checked class="w-4 h-4 text-black border-gray-300 rounded focus:ring-black accent-black">
                            <label for="anon-reservas" class="text-sm font-medium text-gray-700">Permitir reservas anónimas</label>
                        </div>
                        <button type="submit" class="btn-primary px-6 py-2 rounded shadow-md text-sm font-medium">
                            <i class="ph ph-floppy-disk mr-2"></i> Guardar Configuración
                        </button>
                    </form>
                `,
                'log': `
                    <h3 class="text-xl font-semibold mb-4">Historial de Acceso al Sistema</h3>
                    <div class="h-96 overflow-y-scroll border border-gray-200 rounded-lg bg-gray-50 p-4">
                        <ul class="space-y-3">
                            <li class="p-3 bg-white border border-gray-100 rounded shadow-sm text-sm">
                                <span class="font-semibold text-black">[2025-12-12 21:15]</span> - Usuario <span class="text-blue-700 font-medium">Admin General</span> accedió a la <span class="italic">Gestión de Usuarios</span>.
                            </li>
                            <li class="p-3 bg-white border border-gray-100 rounded shadow-sm text-sm">
                                <span class="font-semibold text-black">[2025-12-12 09:45]</span> - Usuario <span class="text-blue-700 font-medium">recepcion01</span> realizó **Check-in** a Habitación 102.
                            </li>
                            <li class="p-3 bg-white border border-gray-100 rounded shadow-sm text-sm text-gray-400 italic">
                                ... Cientos de entradas anteriores ... (Estos datos se obtendrían de la DB en una versión final)
                            </li>
                        </ul>
                    </div>
                    <p class="text-xs text-gray-500 mt-4">Lista de solo lectura.</p>
                `
            };

            tabContentDiv.innerHTML = staticContentMap[tabId] || '<p class="text-red-500">Pestaña no implementada.</p>';
            showLoading(false);
        }

        // --- MANEJO DEL MODAL DE USUARIO (CRUD) ---

        function openCreateUserModal() {
            currentEditingUserId = null;
            userForm.reset();
            modalTitle.textContent = 'Crear Nuevo Usuario';
            passwordHint.classList.remove('hidden'); // Contraseña obligatoria al crear
            userModalError.classList.add('hidden');
            document.getElementById('password').required = true;
            userModal.classList.remove('hidden');
        }

        async function openEditUserModal(userId) {
            try {
                const response = await fetch(`${API_BASE_URL}/admin/users/${userId}`);
                const user = await response.json();

                currentEditingUserId = userId;
                modalTitle.textContent = `Editar Usuario: ${user.username}`;
                
                // Llenar formulario
                document.getElementById('userId').value = user.id;
                document.getElementById('name').value = user.name;
                document.getElementById('username').value = user.username;
                document.getElementById('role').value = user.role;
                document.getElementById('password').value = ''; // Nunca se rellena la contraseña
                document.getElementById('password').required = false; // Contraseña opcional al editar
                passwordHint.textContent = 'Deje vacío para mantener la contraseña actual.';
                passwordHint.classList.remove('hidden');
                userModalError.classList.add('hidden');
                
                userModal.classList.remove('hidden');
            } catch (error) {
                alert('Error al cargar datos del usuario para editar.');
            }
        }

        function closeUserModal() {
            userModal.classList.add('hidden');
        }

        userForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            userModalError.classList.add('hidden');
            
            const formData = new FormData(userForm);
            const userData = Object.fromEntries(formData.entries());
            
            // Si la contraseña está vacía y estamos editando, la eliminamos del objeto para no enviarla al backend
            if (currentEditingUserId !== null && userData.password.trim() === '') {
                delete userData.password;
            } else if (currentEditingUserId === null && userData.password.trim() === '') {
                // Validación estricta para la creación
                userModalError.textContent = 'La contraseña es obligatoria para crear un nuevo usuario.';
                userModalError.classList.remove('hidden');
                return;
            }
            
            // Actualizar botón de carga
            showLoading(submitUserButton, true, '<i class="ph ph-floppy-disk mr-2"></i> Guardar Usuario', 'Guardando...');

            try {
                let response;
                const url = `${API_BASE_URL}/admin/users/${currentEditingUserId || ''}`;
                
                if (currentEditingUserId) {
                    // EDITAR (PUT)
                    response = await fetch(url, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(userData)
                    });
                } else {
                    // CREAR (POST)
                    response = await fetch(API_BASE_URL + '/users', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(userData)
                    });
                }

                if (response.ok) {
                    alert(`Usuario ${userData.username} ${currentEditingUserId ? 'actualizado' : 'creado'} con éxito.`);
                    closeUserModal();
                    loadUserManagementTab(); // Recargar la tabla
                } else {
                    const errorData = await response.json();
                    userModalError.textContent = errorData.message || 'Error desconocido al guardar el usuario.';
                    userModalError.classList.remove('hidden');
                }
            } catch (error) {
                userModalError.textContent = 'Error de conexión con el servidor.';
                userModalError.classList.remove('hidden');
                console.error('CRUD Error:', error);
            } finally {
                showLoading(submitUserButton, false, '<i class="ph ph-floppy-disk mr-2"></i> Guardar Usuario', 'Guardando...');
            }
        });

        async function deleteUser(userId, username) {
            if (!confirm(`¿Está seguro de eliminar al usuario ${username}? Esta acción es irreversible.`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/admin/users/${userId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert(`Usuario ${username} eliminado con éxito.`);
                    loadUserManagementTab(); // Recargar la tabla
                } else {
                    const errorData = await response.json();
                    alert(`Error al eliminar usuario: ${errorData.message}`);
                }
            } catch (error) {
                alert('Error de conexión al eliminar usuario.');
                console.error('Delete Error:', error);
            }
        }
        
        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentDate').textContent = formatDate(new Date());
            switchTab('usuarios');
        });

        function logout() {
            // Lógica para limpiar token o sesión
            alert('Sesión cerrada. Redirigiendo a Login.');
            window.location.href = 'Login.html';
        }

    </script>
</body>
</html>

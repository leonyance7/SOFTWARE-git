<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Recepción - Hotel System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #1a1a1a;
        }

        .bg-maintenance {
            background: repeating-linear-gradient(
                45deg,
                #e5e7eb, #e5e7eb 10px,
                #d1d5db, #d1d5db 20px
            );
            color: #4b5563;
        }
        .room-card {
            transition: all 0.2s ease-in-out;
        }
        .room-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <aside class="w-64 bg-black text-white flex flex-col shadow-xl z-20 hidden md:flex">
        <div class="logo-container">
            <img src="logo2.png" alt="Logo Hotel Soft">
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1">
                <li><a href="Inicio.html" class="flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors"><i class="ph ph-house text-xl"></i><span>Inicio</span></a></li>
                <li><a href="Recepcion.HTML" class="flex items-center gap-3 px-6 py-3 bg-white text-black font-medium border-l-4 border-gray-400"><i class="ph ph-bell-concierge text-xl"></i><span>Recepción</span></a></li>
                <li><a href="Administracion.html" class="flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors"><i class="ph ph-users text-xl"></i><span>Administración</span></a></li>
                <li><a href="Mantenimiento.html" class="flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors"><i class="ph ph-wrench text-xl"></i><span>Mantenimiento</span></a></li>
                <li><a href="GestionReservas.html" class="flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors"><i class="ph ph-calendar-check text-xl"></i><span>Gestion de Reservas</span></a></li>
                <li><a href="Ventas.html" class="flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors"><i class="ph ph-currency-dollar text-xl"></i><span>Ventas</span></a></li>
            </ul>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center"><i class="ph ph-user text-white"></i></div>
                <div>
                    <p class="text-sm font-medium">Recepción 01</p>
                    <p class="text-xs text-gray-500">En línea</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-gray-50 relative">
        
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm">
            <h1 class="text-xl font-semibold text-gray-800">Recepción</h1>
            <div class="flex items-center gap-4">
                <span id="currentDate" class="text-sm text-gray-500 font-medium border-r border-gray-300 pr-4"></span>
                <button class="p-2 text-gray-600 hover:bg-gray-100 rounded-full relative"><i class="ph ph-bell text-xl"></i><span class="absolute top-2 right-2 w-2 h-2 bg-black rounded-full"></span></button>
                <button class="btn-primary px-4 py-2 rounded shadow-md text-sm font-medium bg-black text-white"><i class="ph ph-sign-out mr-2"></i> Cerrar Sesión</button>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-8">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                
                <div class="flex flex-wrap gap-2 bg-white p-1 rounded-lg border border-gray-200 shadow-sm">
                    <button onclick="filterRooms('all')" class="px-4 py-2 text-sm font-medium rounded-md bg-black text-white hover:bg-gray-800 transition-colors focus:outline-none ring-offset-2 focus:ring-2 ring-black">Todos</button>
                    <button onclick="filterRooms('libre')" class="px-4 py-2 text-sm font-medium rounded-md text-gray-600 hover:bg-gray-100 transition-colors flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-gray-300 border border-gray-400"></span> Libre
                    </button>
                    <button onclick="filterRooms('ocupada')" class="px-4 py-2 text-sm font-medium rounded-md text-gray-600 hover:bg-gray-100 transition-colors flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-black"></span> Ocupada
                    </button>
                    <button onclick="filterRooms('mantenimiento')" class="px-4 py-2 text-sm font-medium rounded-md text-gray-600 hover:bg-gray-100 transition-colors flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-gray-400 stripe-icon"></span> Mant.
                    </button>
                </div>

                <div class="flex gap-3">
                    <button onclick="alert('Funcionalidad avanzada de Check-Out: Muestra el listado de huéspedes para facturación.')" class="bg-gray-300 text-gray-800 px-6 py-2.5 rounded shadow hover:bg-gray-400 transition flex items-center gap-2 font-medium">
                        <i class="ph ph-hand-waving"></i>
                        Check-Out Rápido
                    </button>
                    <button onclick="openCheckInModal()" class="bg-black text-white px-6 py-2.5 rounded shadow hover:bg-gray-800 transition flex items-center gap-2 font-medium">
                        <i class="ph ph-plus"></i>
                        Nuevo Check-in
                    </button>
                </div>
            </div>

            <div id="roomGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">
                </div>

        </div>
    </main>

    <div id="checkInModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onclick="closeCheckInModal()"></div>
        
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl bg-white shadow-2xl rounded-lg overflow-hidden">
            
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-black">Registro de Huésped (Check-In)</h3>
                <button onclick="closeCheckInModal()" class="text-gray-400 hover:text-black transition"><i class="ph ph-x text-xl"></i></button>
            </div>

            <div class="p-8"> 
                <form id="checkInForm">
                    <div class="grid grid-cols-1 md:grid-cols-1 gap-6">
                        
                        <div class="space-y-4">
                            <div class="grid grid-cols-3 gap-4">
                                <div>
                                    <label for="tipoDocumento" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Documento</label>
                                    <select id="tipoDocumento" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-black focus:border-black bg-white" required>
                                        <option value="" disabled selected>Seleccione</option>
                                        <option value="CC">C.C. (Cédula de Ciudadanía)</option>
                                        <option value="TI">T.I. (Tarjeta de Identidad)</option>
                                        <option value="CE">C.E. (Cédula de Extranjería)</option>
                                        <option value="PASAPORTE">Pasaporte</option>
                                        <option value="RC">Registro Civil</option>
                                    </select>
                                </div>
                                <div class="col-span-2">
                                    <label for="numeroDocumento" class="block text-sm font-medium text-gray-700 mb-1">Número de Documento</label>
                                    <input type="text" id="numeroDocumento" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-black focus:border-black" placeholder="Ingrese el número" required>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Nombre Completo</label>
                                <input type="text" id="nombreCompleto" placeholder="Ej: Juan Yance" class="w-full border border-gray-300 rounded px-3 py-2 text-black focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition" required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Correo Electrónico</label>
                                <input type="email" id="correoElectronico" placeholder="correo@ejemplo.com" class="w-full border border-gray-300 rounded px-3 py-2 text-black focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition">
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Habitación Asignada</label>
                                <select id="habitacionAsignada" class="w-full border border-gray-300 rounded px-3 py-2 text-black focus:outline-none focus:border-black bg-white" required>
                                    </select>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Entrada</label>
                                    <input type="date" id="fechaEntrada" class="w-full border border-gray-300 rounded px-3 py-2 text-gray-600 focus:outline-none focus:border-black" required>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Salida</label>
                                    <input type="date" id="fechaSalida" class="w-full border border-gray-300 rounded px-3 py-2 text-gray-600 focus:outline-none focus:border-black" required>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Método de Pago</label>
                                <div class="flex gap-4 mt-2">
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" name="pago" value="Efectivo" class="accent-black" checked>
                                        <span class="text-sm">Efectivo</span>
                                    </label>
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" name="pago" value="Tarjeta" class="accent-black">
                                        <span class="text-sm">Tarjeta</span>
                                    </label>
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" name="pago" value="Transferencia" class="accent-black">
                                        <span class="text-sm">Transferencia</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-end gap-3 pt-6 border-t border-gray-100">
                        <button type="button" onclick="closeCheckInModal()" class="px-5 py-2 border border-gray-300 text-gray-600 rounded hover:bg-gray-100 transition text-sm font-medium">Cancelar</button>
                        <button type="submit" class="px-5 py-2 bg-black text-white rounded hover:bg-gray-800 transition text-sm font-medium shadow-lg shadow-gray-400/20">Registrar Entrada</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';

        // --- 1. Fetch de Datos ---
        
        async function fetchRooms() {
            try {
                const response = await fetch(`${API_BASE_URL}/habitaciones`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error("Error al obtener datos de habitaciones:", error);
                alert("Error al cargar las habitaciones. Verifique que el servidor Node.js/Express esté corriendo en el puerto 3000.");
                return [];
            }
        }
        
        // Función de Check-In (POST)
        async function submitCheckIn(event) {
            event.preventDefault();
            const form = event.target;
            const data = {
                idHabitacion: form.querySelector('#habitacionAsignada').value,
                tipoDocumento: form.querySelector('#tipoDocumento').value,
                numeroDocumento: form.querySelector('#numeroDocumento').value,
                nombreCompleto: form.querySelector('#nombreCompleto').value,
                correo: form.querySelector('#correoElectronico').value,
                fechaEntrada: form.querySelector('#fechaEntrada').value,
                fechaSalida: form.querySelector('#fechaSalida').value,
                metodoPago: form.querySelector('input[name="pago"]:checked').value,
            };

            try {
                const response = await fetch(`${API_BASE_URL}/checkin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                const result = await response.json();

                if (response.ok) {
                    alert(`Check-in exitoso: ${result.message}`);
                    closeCheckInModal();
                    renderRooms(); // Refrescar grid
                } else {
                    alert(`Error en el Check-in: ${result.message}`);
                }
            } catch (error) {
                console.error("Error al enviar check-in:", error);
                alert("Error de conexión con el servidor. No se pudo registrar el check-in.");
            }
        }

        // Nueva Función de Check-Out (PATCH)
        window.handleCheckout = async function(roomId) {
            if (!confirm(`¿Confirmar Check-Out para la habitación ${roomId}?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/checkout/${roomId}`, {
                    method: 'PATCH', // Usamos PATCH para actualizar parcialmente el recurso
                    headers: { 'Content-Type': 'application/json' },
                });

                const result = await response.json();

                if (response.ok) {
                    alert(`Check-out exitoso: ${result.message}`);
                    renderRooms(); // Refrescar el grid para mostrar como "Libre"
                } else {
                    alert(`Error en Check-Out: ${result.message}`);
                }
            } catch (error) {
                console.error("Error al realizar check-out:", error);
                alert("Error de conexión con el servidor. No se pudo completar el check-out.");
            }
        }

        // --- 2. Renderizado del Grid ---

        const gridContainer = document.getElementById('roomGrid');
        let currentRoomsData = [];
        let currentFilter = 'all';

        function getStatusClasses(roomStatus) {
            let statusClasses = '';
            let icon = '';
            let statusText = '';
            let textColor = '';
            let subTextColor = '';

            if (roomStatus === 'libre') {
                statusClasses = 'bg-white border border-gray-200';
                icon = 'ph-check-circle';
                statusText = 'Disponible';
                textColor = 'text-black';
                subTextColor = 'text-gray-500';
            } else if (roomStatus === 'ocupada') {
                statusClasses = 'bg-black text-white border border-black';
                icon = 'ph-user';
                statusText = 'Ocupada';
                textColor = 'text-white';
                subTextColor = 'text-gray-400';
            } else if (roomStatus === 'mantenimiento' || roomStatus === 'limpieza') {
                statusClasses = 'bg-maintenance border border-gray-300';
                icon = 'ph-wrench';
                statusText = roomStatus === 'limpieza' ? 'Limpieza' : 'Mantenimiento';
                textColor = 'text-gray-800';
                subTextColor = 'text-gray-600';
            }
            return { statusClasses, icon, statusText, textColor, subTextColor };
        }

        function createRoomCard(room) {
            const { statusClasses, icon, statusText, textColor, subTextColor } = getStatusClasses(room.estado);
            
            const card = document.createElement('div');
            card.className = `room-card p-5 rounded-lg shadow-sm relative cursor-default ${statusClasses}`;

            // Botón de Check-Out interno (solo si está Ocupada)
            let actionButton = '';
            if (room.estado === 'ocupada') {
                // Añadimos 'event.stopPropagation()' para prevenir el click de la card
                actionButton = `
                    <button onclick="event.stopPropagation(); handleCheckout(${room.id})" 
                        class="mt-4 w-full text-black bg-white hover:bg-gray-100 py-1.5 rounded text-xs font-semibold transition shadow">
                        Check-Out
                    </button>
                `;
            } else {
                // Añadir un evento de click genérico a la card solo si no está ocupada o para detalles
                card.onclick = () => alert(`Detalles de Habitación ${room.id}\nEstado: ${statusText}`);
            }


            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <span class="text-2xl font-bold ${textColor}">${room.id}</span>
                    <i class="ph ${icon} text-xl opacity-70"></i>
                </div>
                <div class="space-y-1">
                    <p class="text-xs font-medium uppercase tracking-wider opacity-70">Tipo</p>
                    <p class="font-medium ${textColor}">${room.tipo}</p>
                </div>
                <div class="mt-4 pt-3 border-t ${room.estado === 'ocupada' ? 'border-gray-700' : 'border-gray-200'}">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold ${subTextColor}">${statusText}</span>
                        ${room.huesped_actual ? `<span class="text-xs truncate max-w-[80px] text-right opacity-80" title="${room.huesped_actual}">${room.huesped_actual}</span>` : ''}
                    </div>
                </div>
                ${actionButton}
            `;
            
            gridContainer.appendChild(card);
        }

        async function renderRooms(filter = currentFilter) {
            currentFilter = filter;
            currentRoomsData = await fetchRooms(); // Siempre refrescar para tener el estado actual
            
            gridContainer.innerHTML = '';

            const filteredRooms = currentFilter === 'all' 
                ? currentRoomsData 
                : currentRoomsData.filter(room => {
                    if(currentFilter === 'mantenimiento') return room.estado === 'mantenimiento' || room.estado === 'limpieza';
                    return room.estado === currentFilter;
                });

            filteredRooms.forEach(createRoomCard);
            updateModalRoomOptions();
        }

        // --- 3. Lógica de UI ---
        
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('es-ES', dateOptions);

        const checkInModal = document.getElementById('checkInModal');
        const roomSelect = checkInModal.querySelector('#habitacionAsignada');
        const checkInForm = checkInModal.querySelector('#checkInForm'); // ID añadido en el HTML

        checkInForm.onsubmit = submitCheckIn;

        function updateModalRoomOptions() {
            roomSelect.innerHTML = '';
            const freeRooms = currentRoomsData.filter(room => room.estado === 'libre');

            if (freeRooms.length === 0) {
                const option = document.createElement('option');
                option.textContent = 'No hay habitaciones libres';
                option.disabled = true;
                option.selected = true;
                roomSelect.appendChild(option);
            } else {
                freeRooms.forEach(room => {
                    const option = document.createElement('option');
                    option.value = room.id;
                    option.textContent = `${room.id} - ${room.tipo} (Libre)`;
                    roomSelect.appendChild(option);
                });
            }
        }

        function openCheckInModal() {
            checkInModal.classList.remove('hidden');
            setTimeout(() => {
                checkInModal.firstElementChild.classList.add('opacity-100');
            }, 10);
            updateModalRoomOptions();
        }

        function closeCheckInModal() {
            checkInModal.classList.add('hidden');
            checkInForm.reset();
        }

        window.filterRooms = renderRooms; 

        // Render inicial
        renderRooms();

    </script>
</body>
</html>
